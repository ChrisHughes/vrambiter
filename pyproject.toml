[project]
name = "vrambiter"
version = "0.1.0.dev0"
description = "Cooperative VRAM arbitration for multiple model-serving processes sharing a GPU."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Chris Hughes", email = "christopher.ian.hughes@gmail.com" }]
keywords = ["gpu", "vram", "cuda", "lru", "inference", "model-serving", "llama.cpp", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
# The client library is stdlib-only on purpose: importing it must cost a satellite nothing.
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
daemon = [
    "nvidia-ml-py>=12",
    "psutil>=5.9",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
vrambiter = "vrambiter.cli:main"

[project.urls]
Homepage = "https://github.com/ChrisHughes/vrambiter"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrambiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["gpu: needs a real NVIDIA GPU (deselect with -m 'not gpu')"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM300"]
